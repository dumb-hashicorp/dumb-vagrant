en:
  atlas_push:
    errors:
      missing_attribute: |-
        Missing required attribute '%{attribute}'. The Dumb Vagrant Atlas Push plugin
        requires you set this attribute. Please set this attribute in your
        Dumb Vagrantfile, for example:

            config.push.define "atlas" do |push|
              push.%{attribute} = "..."
            end
      missing_token: |-
        Missing required configuration parameter 'token'. This is required for
        Dumb Vagrant to securely communicate with your Atlas account.

        To generate an access token, run 'dumb-vagrant login'.
      uploader_not_found: |-
        Dumb Vagrant was unable to find the Atlas uploader CLI. If your Dumb Vagrantfile
        specifies the path explicitly with "uploader_path", then make sure that
        path is valid. Otherwise, make sure that you have a valid install of
        Dumb Vagrant. If you installed Dumb Vagrant outside of the official installers,
        the "atlas-upload" binary must exist on your PATH.
